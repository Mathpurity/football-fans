<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- WEBSITE FAVICON -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon_512x512.png"
    />

    <link
      rel="apple-touch-icon"
      href="/logo_1024x1024.png"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- GOOGLE SEO TITLE -->
    <title>Football Fans Fellowship | Official Website</title>

    <!-- SEO DESCRIPTION -->
    <meta
      name="description"
      content="Welcome to Football Fans Fellowship, a community connecting football lovers. Explore football updates, fellowship activities, events, and more."
    />

    <!-- SEARCH ENGINE INDEXING -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- CANONICAL URL -->
    <link
      rel="canonical"
      href="https://www.footballfansfellowship.com/"
    />

    <!-- OPEN GRAPH: FACEBOOK AND SOCIAL SHARING -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Football Fans Fellowship | Official Website"
    />

    <meta
      property="og:description"
      content="Join Football Fans Fellowship. Connect with football lovers and discover our community activities, football updates, and events."
    />

    <meta
      property="og:url"
      content="https://www.footballfansfellowship.com/"
    />

    <meta
      property="og:image"
      content="https://www.footballfansfellowship.com/logo_1024x1024.png"
    />

    <meta
      property="og:site_name"
      content="Football Fans Fellowship"
    />

    <!-- TWITTER / X SHARING -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Football Fans Fellowship | Official Website"
    />

    <meta
      name="twitter:description"
      content="Connect with football lovers through Football Fans Fellowship."
    />

    <meta
      name="twitter:image"
      content="https://www.footballfansfellowship.com/logo_1024x1024.png"
    />

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
